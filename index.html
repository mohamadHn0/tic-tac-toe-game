<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="controls">
      <input type="text" id="player1-input" placeholder="Player 1 (X)" />
      <input type="text" id="player2-input" placeholder="Player 2 (O)" />
      <button id="start-btn">Start / Restart</button>
    </div>

    <div id="status-message" class="status">Enter names or click Start to play!</div>

    <div id="gameboard" class="board"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
